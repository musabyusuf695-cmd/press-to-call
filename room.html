<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Press to Call</title>

  <link rel="stylesheet" href="style.css">

</head>


<body class="room-page">


<main class="call-screen">


  <!-- MAIN PHOTO / VIDEO -->

  <div class="media-container">

    <img
      id="callImage"
      class="call-media hidden"
      alt="Call media"
    >

    <video
      id="callVideo"
      class="call-media hidden"
      autoplay
      loop
      playsinline
    ></video>

  </div>


  <!-- DARK GRADIENT -->

  <div class="call-overlay"></div>


  <!-- TOP BAR -->

  <header class="top-bar">

    <div class="call-time">

      <span class="security-icon">
        🛡️
      </span>

      <span id="callTimer">
        00:00
      </span>

    </div>


    <div class="top-actions">

      <button
        id="participantsTop"
        class="top-icon"
        aria-label="Participants"
      >
        👥
        <span id="participantCount">
          2
        </span>
      </button>


      <button
        id="moreButton"
        class="top-icon"
        aria-label="More options"
      >
        ⋮
      </button>

    </div>

  </header>


  <!-- SMALL SELF PREVIEW -->

  <div
    id="selfPreview"
    class="self-preview"
  >

    <video
      id="selfVideo"
      autoplay
      muted
      playsinline
    ></video>

    <div
      id="selfPlaceholder"
      class="self-placeholder"
    >
      You
    </div>

  </div>


  <!-- CENTER INFO -->

  <section
    id="centerInfo"
    class="center-info"
  >

    <div
      class="center-avatar"
      id="centerAvatar"
    >
      P
    </div>

    <h2 id="centerName">
      Press to Call
    </h2>

    <p id="centerStatus">
      Connecting...
    </p>

  </section>


  <!-- BOTTOM CONTROLS -->

  <footer class="call-controls">


    <!-- MUTE -->

    <button
      id="muteButton"
      class="control-item"
    >

      <span
        id="muteIcon"
        class="control-icon"
      >
        🎤
      </span>

      <span>
        Mute
      </span>

    </button>



    <!-- VIDEO -->

    <button
      id="videoButton"
      class="control-item"
    >

      <span
        id="videoIcon"
        class="control-icon"
      >
        📹
      </span>

      <span id="videoText">
        Stop Video
      </span>

    </button>



    <!-- END -->

    <button
      id="endButton"
      class="control-item end-item"
    >

      <span class="end-icon">
        📞
      </span>

      <span>
        End
      </span>

    </button>



    <!-- PARTICIPANTS -->

    <button
      id="participantsButton"
      class="control-item"
    >

      <span class="control-icon">
        👥
      </span>

      <span>
        Participants
      </span>

    </button>



    <!-- MORE -->

    <button
      id="bottomMoreButton"
      class="control-item"
    >

      <span class="control-icon">
        •••
      </span>

      <span>
        More
      </span>

    </button>


  </footer>


  <!-- LOADING -->

  <div
    id="loadingScreen"
    class="loading-screen"
  >

    <div class="loading-spinner"></div>

    <p>
      Joining call...
    </p>

  </div>


  <!-- ERROR -->

  <div
    id="errorScreen"
    class="error-screen hidden"
  >

    <div class="error-icon">
      !
    </div>

    <h2>
      Call unavailable
    </h2>

    <p id="errorMessage">
      This call could not be found.
    </p>

    <button
      onclick="goHome()"
      class="error-button"
    >
      Go Home
    </button>

  </div>


</main>


<script
  type="module"
  src="room.js"
></script>


</body>

</html>
