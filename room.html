<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Incoming Call</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="room-page">

  <main class="call-screen">

    <!-- PHOTO -->
    <img
      id="callImage"
      class="call-media hidden"
      alt=""
    >

    <!-- VIDEO -->
    <video
      id="callVideo"
      class="call-media hidden"
      autoplay
      loop
      playsinline
    ></video>


    <!-- DARK OVERLAY -->
    <div class="call-overlay"></div>


    <!-- TOP BAR -->
    <header class="call-header">

      <div class="caller-info">

        <div
          id="callerAvatar"
          class="caller-avatar"
        >
          P
        </div>

        <div>

          <h1 id="callerName">
            Press to Call
          </h1>

          <p id="callStatus">
            Connecting...
          </p>

        </div>

      </div>


      <button
        id="moreButton"
        class="icon-button"
        type="button"
        aria-label="More options"
      >
        ⋮
      </button>

    </header>


    <!-- CENTER INFO -->
    <section
      id="centerInfo"
      class="center-info"
    >

      <div
        id="centerAvatar"
        class="center-avatar"
      >
        P
      </div>

      <h2 id="centerName">
        Press to Call
      </h2>

      <p id="centerStatus">
        Connecting...
      </p>

    </section>


    <!-- BOTTOM CONTROLS -->
    <footer class="call-controls">

      <button
        id="muteButton"
        class="control-button"
        type="button"
        aria-label="Mute"
      >
        <span id="muteIcon">🎤</span>
      </button>


      <button
        id="speakerButton"
        class="control-button"
        type="button"
        aria-label="Speaker"
      >
        🔊
      </button>


      <button
        id="endButton"
        class="end-button"
        type="button"
        aria-label="End call"
      >
        📞
      </button>

    </footer>

  </main>


  <script
    type="module"
    src="room.js"
  ></script>

</body>
</html>
