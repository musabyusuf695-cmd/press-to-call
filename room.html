<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Press to Call</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="room-page">

  <!-- CALL SCREEN -->
  <main class="call-screen">

    <!-- Background media -->
    <div class="media-container">

      <img
        id="callImage"
        class="call-media hidden"
        alt="Call media"
      >

      <video
        id="callVideo"
        class="call-media hidden"
        autoplay
        loop
        playsinline
        controlslist="nodownload"
      ></video>

      <!-- Loading -->
      <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Joining call...</p>
      </div>

      <!-- Error -->
      <div id="errorScreen" class="error-screen hidden">
        <div class="error-icon">!</div>

        <h2>Call unavailable</h2>

        <p id="errorMessage">
          This call could not be found.
        </p>

        <button onclick="goHome()" class="error-button">
          Go Home
        </button>
      </div>

    </div>


    <!-- Dark overlay -->
    <div class="call-overlay"></div>


    <!-- TOP BAR -->
    <header class="call-header">

      <div class="caller-info">

        <div id="callerAvatar" class="caller-avatar">
          P
        </div>

        <div>
          <h1 id="callerName">
            Press to Call
          </h1>

          <p id="callStatus">
            Connecting...
          </p>
        </div>

      </div>

      <button
        id="moreButton"
        class="icon-button"
        aria-label="More options"
      >
        ⋮
      </button>

    </header>


    <!-- CENTER STATUS -->
    <section id="centerInfo" class="center-info">

      <div class="center-avatar" id="centerAvatar">
        P
      </div>

      <h2 id="centerName">
        Press to Call
      </h2>

      <p id="centerStatus">
        Connecting...
      </p>

    </section>


    <!-- BOTTOM CONTROLS -->
    <footer class="call-controls">

      <button
        id="muteButton"
        class="control-button"
        aria-label="Mute"
      >
        <span id="muteIcon">🎤</span>
      </button>

      <button
        id="speakerButton"
        class="control-button"
        aria-label="Speaker"
      >
        🔊
      </button>

      <button
        id="endButton"
        class="end-button"
        aria-label="End call"
      >
        📞
      </button>

    </footer>

  </main>


  <script type="module" src="room.js"></script>

</body>
</html>
